<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Content Security Policy to allow connection to Google Apps Script -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com; connect-src 'self' https://script.google.com https://*.googleusercontent.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;">
  
  <title>New Registration - QR Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- LOGIN CARD -->
  <div id="loginCard" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-4">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">System Login</h1>
      <p class="text-xs text-slate-500 mt-1">Authenticate to access Registration Portal</p>
    </div>
    <div class="space-y-3 pt-2">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
        <input type="text" id="loginUsername" placeholder="e.g. admin" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Passcode</label>
        <input type="password" id="loginPassword" placeholder="Enter password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <button onclick="handleLoginSubmit()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md">
        Unlock Portal
      </button>
    </div>
    <p id="loginError" class="text-xs text-red-500 text-center hidden"></p>
  </div>

  <!-- REGISTRATION SECTION -->
  <div id="appSection" class="hidden w-full max-w-md bg-white rounded-2xl shadow-xl p-5 space-y-4 my-2">
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h1 class="text-lg font-bold text-slate-800">Register Student</h1>
        <p id="userRoleBadge" class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider"></p>
      </div>
      <button onclick="logout()" class="text-xs text-red-500 font-semibold hover:underline">Logout</button>
    </div>

    <!-- Navigation -->
    <nav class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-center">
      <a href="index.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Scan QR</a>
      <a href="find.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Find Student</a>
      <a href="register.html" class="py-2.5 rounded-lg text-white bg-indigo-600">New Reg</a>
    </nav>

    <form id="regForm" onsubmit="handleRegistration(event)" class="space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">First Name *</label>
          <input type="text" id="regFirst" required placeholder="First name" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Last Name *</label>
          <input type="text" id="regLast" required placeholder="Last name" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Class *</label>
          <select id="regClass" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
            <option value="" disabled selected>Loading classes...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Date of Birth *</label>
          <input type="date" id="regDob" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Parent Name *</label>
        <input type="text" id="regParentName" required placeholder="Parent / Guardian Name" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Parent Phone/WhatsApp *</label>
          <input type="tel" id="regParentPhone" required placeholder="+1234567890" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address *</label>
          <input type="email" id="regEmail" required placeholder="parent@email.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
      </div>

      <p class="text-[11px] text-slate-400 text-center italic mt-1">Unique Student ID (STU000 format) generated automatically.</p>

      <button type="submit" id="btnRegister" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md text-sm mt-2">
        Register & Save to Sheet
      </button>
    </form>

    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs text-center font-semibold"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const sessionRole = sessionStorage.getItem('userRole');
      if (sessionRole) showAppUI(sessionRole);
    });

    async function handleLoginSubmit() {
      const user = document.getElementById('loginUsername').value.trim();
      const pwd = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');

      if (!user || !pwd) return;
      const res = await loginApi(user, pwd);
      if (res.success) {
        sessionStorage.setItem('userRole', res.role);
        sessionStorage.setItem('username', res.username);
        showAppUI(res.role);
      } else {
        errEl.innerText = res.message || "Invalid Credentials";
        errEl.classList.remove('hidden');
      }
    }

    async function showAppUI(role) {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userRoleBadge').innerText = `Session: ${role}`;
      await loadClassDropdown();
    }

    async function loadClassDropdown() {
      const classSelect = document.getElementById('regClass');
      try {
        const res = await getValidClassesApi();
        if (res.success && res.classes && res.classes.length > 0) {
          classSelect.innerHTML = '<option value="" disabled selected>Select class...</option>';
          res.classes.forEach(cls => {
            const opt = document.createElement('option');
            opt.value = cls;
            opt.innerText = cls;
            classSelect.appendChild(opt);
          });
        } else {
          classSelect.innerHTML = '<option value="" disabled selected>No class tabs found</option>';
        }
      } catch (err) {
        classSelect.innerHTML = '<option value="" disabled selected>Error loading classes</option>';
      }
    }

    function logout() {
      sessionStorage.clear();
      window.location.reload();
    }

    async function handleRegistration(e) {
      e.preventDefault();
      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.innerText = "Registering...";
      showAlert("Generating unique ID & saving...", "blue");

      const studentData = {
        firstName: document.getElementById('regFirst').value.trim(),
        lastName: document.getElementById('regLast').value.trim(),
        className: document.getElementById('regClass').value,
        dob: document.getElementById('regDob').value,
        parentName: document.getElementById('regParentName').value.trim(),
        parentPhone: document.getElementById('regParentPhone').value.trim(),
        email: document.getElementById('regEmail').value.trim()
      };

      try {
        const res = await registerStudentApi(studentData);
        showAlert(res.message, res.success ? "green" : "red");

        if (res.success) {
          document.getElementById('regForm').reset();
          await loadClassDropdown();
        }
      } catch (err) {
        showAlert("Failed to connect to backend", "red");
      } finally {
        btn.disabled = false;
        btn.innerText = "Register & Save to Sheet";
      }
    }

    function showAlert(msg, type) {
      const banner = document.getElementById('alertBanner');
      banner.classList.remove('hidden', 'bg-blue-100', 'text-blue-800', 'bg-red-100', 'text-red-800', 'bg-emerald-100', 'text-emerald-800');
      if (type === "blue") banner.classList.add('bg-blue-100', 'text-blue-800');
      if (type === "red") banner.classList.add('bg-red-100', 'text-red-800');
      if (type === "green") banner.classList.add('bg-emerald-100', 'text-emerald-800');
      banner.innerText = msg;
    }
  </script>
</body>
</html>
