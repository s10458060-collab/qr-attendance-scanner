<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Content Security Policy to allow connection to Google Apps Script -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com; connect-src 'self' https://script.google.com https://*.googleusercontent.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;">
  
  <title>Find Student - QR Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- LOGIN CARD -->
  <div id="loginCard" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-4">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">System Login</h1>
      <p class="text-xs text-slate-500 mt-1">Authenticate to access Student Finder</p>
    </div>
    <div class="space-y-3 pt-2">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
        <input type="text" id="loginUsername" placeholder="e.g. admin" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Passcode</label>
        <input type="password" id="loginPassword" placeholder="Enter password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <button onclick="handleLoginSubmit()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md">
        Unlock Portal
      </button>
    </div>
    <p id="loginError" class="text-xs text-red-500 text-center hidden"></p>
  </div>

  <!-- FIND SECTION -->
  <div id="appSection" class="hidden w-full max-w-lg bg-white rounded-2xl shadow-xl p-5 space-y-4 my-2">
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h1 class="text-lg font-bold text-slate-800">Find Student Record</h1>
        <p id="userRoleBadge" class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider"></p>
      </div>
      <button onclick="logout()" class="text-xs text-red-500 font-semibold hover:underline">Logout</button>
    </div>

    <!-- Navigation -->
    <nav class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-center">
      <a href="index.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Scan QR</a>
      <a href="find.html" class="py-2.5 rounded-lg text-white bg-indigo-600">Find Student</a>
      <a href="register.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">New Reg</a>
    </nav>

    <!-- Search Input Bar -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-600">Search by Name or Student ID (e.g. STU001)</label>
      <div class="flex gap-2">
        <input type="text" id="searchInput" placeholder="Enter student name or ID..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        <button onclick="performSearch()" id="btnSearch" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md text-sm whitespace-nowrap">
          Search
        </button>
      </div>
    </div>

    <!-- Search Results Container -->
    <div id="resultsContainer" class="space-y-3 max-h-96 overflow-y-auto pr-1">
      <p class="text-xs text-slate-400 text-center py-6 italic">Enter a query above to search records across all classes.</p>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const sessionRole = sessionStorage.getItem('userRole');
      if (sessionRole) showAppUI(sessionRole);
    });

    async function handleLoginSubmit() {
      const user = document.getElementById('loginUsername').value.trim();
      const pwd = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');

      if (!user || !pwd) return;
      const res = await loginApi(user, pwd);
      if (res.success) {
        sessionStorage.setItem('userRole', res.role);
        sessionStorage.setItem('username', res.username);
        showAppUI(res.role);
      } else {
        errEl.innerText = res.message || "Invalid Credentials";
        errEl.classList.remove('hidden');
      }
    }

    function showAppUI(role) {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userRoleBadge').innerText = `Session: ${role}`;
    }

    function logout() {
      sessionStorage.clear();
      window.location.reload();
    }

    async function performSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const container = document.getElementById('resultsContainer');
      
      if (!query) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6 italic">Please enter a search term.</p>';
        return;
      }

      container.innerHTML = '<p class="text-xs text-blue-600 text-center py-4">Searching records...</p>';

      try {
        const res = await searchStudentsApi(query);
        if (res.success && res.students && res.students.length > 0) {
          container.innerHTML = '';
          res.students.forEach(student => {
            const card = document.createElement('div');
            card.className = "p-3 rounded-xl border border-slate-200 bg-slate-50 space-y-1 text-xs";
            card.innerHTML = `
              <div class="flex justify-between font-bold text-slate-800 text-sm">
                <span>${student.firstName} ${student.lastName}</span>
                <span class="text-indigo-600 font-mono">${student.studentId}</span>
              </div>
              <div class="text-slate-600"><span class="font-semibold">Assigned Class Tab:</span> ${student.className}</div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">No matching students found.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p class="text-xs text-red-500 text-center py-6">Error retrieving search results.</p>';
      }
    }

    document.getElementById('searchInput')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });
  </script>
</body>
</html>
