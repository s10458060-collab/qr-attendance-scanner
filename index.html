<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR - Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.min.js"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- LOGIN SECTION -->
  <div id="loginCard" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-4">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">System Login</h1>
      <p class="text-xs text-slate-500 mt-1">Authenticate to access Attendance Portal</p>
    </div>

    <div class="space-y-3 pt-2">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Passcode</label>
        <input type="password" id="loginPassword" placeholder="Enter system password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <button onclick="handleLoginSubmit()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md">
        Unlock Portal
      </button>
    </div>
    <p id="loginError" class="text-xs text-red-500 text-center hidden"></p>
  </div>

  <!-- MAIN APP SECTION -->
  <div id="appSection" class="hidden w-full max-w-md bg-white rounded-2xl shadow-xl p-5 space-y-4 my-2">
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h1 class="text-lg font-bold text-slate-800">QR Attendance</h1>
        <p id="userRoleBadge" class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider"></p>
      </div>
      <button onclick="logout()" class="text-xs text-red-500 font-semibold hover:underline">Logout</button>
    </div>

    <!-- Navigation -->
    <nav class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-center">
      <a href="index.html" class="py-2.5 rounded-lg text-white bg-indigo-600">Scan QR</a>
      <a href="find.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Find Student</a>
      <a href="register.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">New Reg</a>
    </nav>

    <!-- Scan View Content -->
    <div class="space-y-3">
      <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden flex items-center justify-center">
        <video id="qr-video" playsinline autoplay muted class="w-full h-full object-cover"></video>
        <canvas id="canvas" class="hidden"></canvas>
      </div>
      <p id="cameraStatus" class="text-xs text-center text-slate-400">Requesting camera permissions...</p>
    </div>

    <!-- Student Details Result Card -->
    <div id="resultCard" class="hidden border-2 rounded-2xl p-5 space-y-3 transition-all duration-300">
      <div class="flex justify-between items-center">
        <span id="cardClassBadge" class="text-xs font-bold px-3 py-1 rounded-full text-white shadow-sm">Class</span>
        <span id="cardId" class="text-xs font-mono font-bold opacity-75">ID</span>
      </div>
      <div>
        <h3 id="cardName" class="text-xl font-extrabold text-slate-900">First Last</h3>
        <p id="cardClassText" class="text-xs font-semibold opacity-80 mt-0.5">Class Name</p>
      </div>
      
      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="btnMarkPresent" onclick="handleMarkPresent()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition shadow-md">
          Mark Present
        </button>
        <button id="btnCancelScan" onclick="handleCancelScan()" class="w-full bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-300 transition">
          Cancel
        </button>
      </div>
    </div>

    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs text-center font-semibold"></div>
  </div>

  <script>
    let videoStream = null;
    let scanningActive = false;
    let activeStudent = null;
    let studentCache = {};
    let isCacheLoaded = false;

    function getClassColor(className) {
      if (!className) return '#202124';
      
      const name = String(className).trim().toLowerCase();
      console.log("Evaluating class color for:", name); // Check F12 Console to see exact string

      // Exact or substring checks in precise order from most specific to general
      if (name.includes('part 1c') || name.includes('12+')) {
        return '#000000'; // Black
      } 
      if (name.includes('part 1b') || name.includes('7+')) {
        return '#ff69b4'; // Pink
      } 
      if (name.includes('part 1a') || name.includes('4-6') || name.includes('4 - 6')) {
        return '#d93025'; // Red
      } 
      if (name.includes('below 4')) {
        return '#1a73e8'; // Blue
      } 
      if (name.includes('part 2')) {
        return '#ff8c00'; // Orange
      } 
      if (name.includes('part 3')) {
        return '#800080'; // Purple
      } 
      if (name.includes('part 4') || name.includes('part 5') || name.includes('4-5') || name.includes('4 - 5')) {
        return '#0d652d'; // Green
      } 
      if (name.includes('part 6')) {
        return '#fbbc04'; // Yellow
      } 
      if (name.includes('pronounciation') || name.includes('pronunciation')) {
        return '#8b4513'; // Brown
      }
      
      return '#5f6368'; // Fallback gray
    }
      
    window.addEventListener('DOMContentLoaded', () => {
      preloadStudentRoster();

      const sessionRole = sessionStorage.getItem('userRole');
      if (sessionRole) {
        showAppUI(sessionRole);
      }
    });

    async function preloadStudentRoster() {
      document.getElementById('cameraStatus').innerText = "Syncing student roster...";
      try {
        const res = await searchStudentsApi({ id: "" });
        if (res.success && res.students) {
          studentCache = {};
          res.students.forEach(student => {
            const cleanId = String(student.id).trim().toUpperCase();
            studentCache[cleanId] = student;
          });
          isCacheLoaded = true;
          document.getElementById('cameraStatus').innerText = "Scanning active (Instant Mode)";
        }
      } catch (e) {
        document.getElementById('cameraStatus').innerText = "Scanning active...";
      }
    }

    async function handleLoginSubmit() {
      const pwd = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');

      if (!pwd) return;

      const res = await loginApi(pwd);
      if (res.success) {
        sessionStorage.setItem('userRole', res.role);
        showAppUI(res.role);
      } else {
        errEl.innerText = res.message || "Invalid Passcode";
        errEl.classList.remove('hidden');
      }
    }

    function showAppUI(role) {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userRoleBadge').innerText = `Session: ${role}`;
      startCamera();
    }

    function logout() {
      stopCamera();
      sessionStorage.clear();
      window.location.reload();
    }

    async function startCamera() {
      stopCamera();
      const video = document.getElementById('qr-video');
      
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: { ideal: "environment" } } 
        });
      } catch (e) {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
        } catch (err) {
          document.getElementById('cameraStatus').innerText = "Camera access denied or unavailable.";
          return;
        }
      }

      video.srcObject = videoStream;
      video.play();
      scanningActive = true;
      requestAnimationFrame(scanFrame);
    }

    function stopCamera() {
      scanningActive = false;
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    // Restored full-speed frame loop so QR codes scan instantly again
    function scanFrame() {
      if (!scanningActive) return;
      
      const video = document.getElementById('qr-video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, canvas.width, canvas.height);

        if (code && code.data) {
          scanningActive = false;
          fetchStudentFast(code.data.trim());
          return;
        }
      }
      requestAnimationFrame(scanFrame);
    }

    async function fetchStudentFast(scannedId) {
      const cleanId = String(scannedId).trim().toUpperCase();

      if (isCacheLoaded && studentCache[cleanId]) {
        activeStudent = studentCache[cleanId];
        applyStudentCardTheme(activeStudent);
        showAlert("", "hide");
        return;
      }

      showAlert("Searching student...", "blue");
      try {
        const res = await searchStudentsApi({ id: cleanId });
        
        if (!res.success || !res.students || res.students.length === 0) {
          showAlert(res.message || "Student not found.", "red");
          setTimeout(() => { scanningActive = true; scanFrame(); }, 1500);
          return;
        }

        activeStudent = res.students[0];
        applyStudentCardTheme(activeStudent);
        showAlert("", "hide");
      } catch (err) {
        showAlert("Connection error while fetching student details.", "red");
        setTimeout(() => { scanningActive = true; scanFrame(); }, 1500);
      }
    }

    function applyStudentCardTheme(student) {
      const card = document.getElementById('resultCard');
      const className = student.className || student.class || 'Class';
      const hexColor = getClassColor(className);

      document.getElementById('cardName').innerText = `${student.firstName} ${student.lastName}`;
      document.getElementById('cardId').innerText = `ID: ${student.id}`;
      document.getElementById('cardClassText').innerText = className;

      const badge = document.getElementById('cardClassBadge');
      badge.innerText = className;
      badge.style.backgroundColor = hexColor;

      card.style.backgroundColor = hexToRgba(hexColor, 0.12);
      card.style.borderColor = hexColor;
      card.classList.remove('hidden');
    }

    function hexToRgba(hex, alpha) {
      const cleanHex = hex.replace('#', '');
      const r = parseInt(cleanHex.substring(0, 2), 16) || 59;
      const g = parseInt(cleanHex.substring(2, 4), 16) || 130;
      const b = parseInt(cleanHex.substring(4, 6), 16) || 246;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    async function handleMarkPresent() {
      if (!activeStudent) return;
      showAlert("Marking attendance...", "blue");

      try {
        const res = await markAttendance(activeStudent);
        showAlert(res.message, res.success ? "green" : "red");
        
        if (res.success) {
          document.getElementById('resultCard').classList.add('hidden');
          setTimeout(() => { 
            showAlert("", "hide");
            scanningActive = true; 
            scanFrame(); 
          }, 400);
        }
      } catch (e) {
        showAlert("Failed to mark attendance", "red");
      }
    }

    function handleCancelScan() {
      activeStudent = null;
      document.getElementById('resultCard').classList.add('hidden');
      showAlert("", "hide");
      scanningActive = true;
      scanFrame();
      document.getElementById('cameraStatus').innerText = "Scanning active...";
    }

    function showAlert(msg, type) {
      const banner = document.getElementById('alertBanner');
      if (type === "hide") {
        banner.classList.add('hidden');
        return;
      }

      banner.classList.remove('hidden', 'bg-blue-100', 'text-blue-800', 'bg-red-100', 'text-red-800', 'bg-emerald-100', 'text-emerald-800');

      if (type === "blue") banner.classList.add('bg-blue-100', 'text-blue-800');
      if (type === "red") banner.classList.add('bg-red-100', 'text-red-800');
      if (type === "green") banner.classList.add('bg-emerald-100', 'text-emerald-800');

      banner.innerText = msg;
    }
  </script>
  
  </body>
</html>
